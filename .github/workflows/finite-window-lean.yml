name: Finite-window Lean checks

on:
  pull_request:
    branches: [main]
    paths:
      - "research/hug-v3/finite-window-lean/**"
      - ".github/workflows/finite-window-lean.yml"
      - "scripts/ci-lean-toolchain.sh"
  push:
    branches: [main]
    paths:
      - "research/hug-v3/finite-window-lean/**"
      - ".github/workflows/finite-window-lean.yml"
      - "scripts/ci-lean-toolchain.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Window rule and recorded numbers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check saved fingerprints, targets and refusal cases
        working-directory: research/hug-v3/finite-window-lean
        run: |
          python3 check_saved_receipt.py
          python3 -m unittest test_saved_receipt.py
      - name: Fetch the pinned Lean release
        run: bash scripts/ci-lean-toolchain.sh fetch "$RUNNER_TEMP/window-tools"
      - name: Install the checked Lean archive
        working-directory: research/hug-v3/finite-window-lean
        run: bash "$GITHUB_WORKSPACE/scripts/ci-lean-toolchain.sh" install "$RUNNER_TEMP/window-tools" "$RUNNER_TEMP/window-lean"
      - name: Recheck all statements in a fresh copy
        shell: bash
        run: |
          cp -a research/hug-v3/finite-window-lean "$RUNNER_TEMP/window-check"
          cd "$RUNNER_TEMP/window-check"
          python3 verify.py
          lake build 2>&1 | tee evidence/lake-build.log
          cd "$GITHUB_WORKSPACE/research/hug-v3/finite-window-lean"
          python3 check_saved_receipt.py --fresh "$RUNNER_TEMP/window-check/receipt.json"
      - name: Attach this GitHub run to the matching proof receipt
        shell: python
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          import hashlib,json,os
          from pathlib import Path
          output=Path(os.environ["RUNNER_TEMP"])/"window-check"
          raw=output/"receipt.json"
          receipt=json.loads(raw.read_text())
          receipt["execution_context"]={
            "repository":os.environ["GITHUB_REPOSITORY"],
            "checkout_sha":os.environ["GITHUB_SHA"],
            "pull_request_head_sha":os.environ.get("PR_HEAD") or None,
            "event":os.environ["GITHUB_EVENT_NAME"],
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
            "run_url":os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]}
          receipt["raw_local_checker_receipt_sha256"]=hashlib.sha256(raw.read_bytes()).hexdigest()
          receipt["scope"]="GitHub Lean-kernel check of nested-window rules and exact recorded numbers; not the fluid simulation."
          receipt["limits"]=[x for x in receipt["limits"] if x!="Local verification; not a GitHub Actions receipt or published Lean result."]
          receipt["lake_build"]="PASS"
          for step in receipt["runs"]:step["command"][0]="lean"
          (output/"github-receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: finite-window-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/window-check/github-receipt.json
            ${{ runner.temp }}/window-check/receipt.json
            ${{ runner.temp }}/window-check/evidence/*.log
          if-no-files-found: warn

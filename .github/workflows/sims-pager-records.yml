name: SIMS pager trial records

on:
  pull_request:
    branches: [main]
    paths:
      - "lean/sims-meeting-thread-lean/**"
      - "lean/sims-mentor-first-thought-lean/**"
      - ".github/workflows/sims-pager-records.yml"
  push:
    branches: [main]
    paths:
      - "lean/sims-meeting-thread-lean/**"
      - "lean/sims-mentor-first-thought-lean/**"
      - ".github/workflows/sims-pager-records.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify restaurant reports and Lean input
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 lean/sims-meeting-thread-lean/observations/pager-return/check_records.py
      - name: Check the free reports before the pager question and all mentor clock ticks
        run: python3 -B lean/sims-mentor-first-thought-lean/check_records.py
      - name: Reconstruct all 130 private inputs in the fresh-listener prime sweep
        run: python3 -B lean/sims-mentor-first-thought-lean/prime-sweep/check_sweep.py
      - name: Check the unlabelled two-tremble trial records and Lean table
        run: python3 -B lean/sims-meeting-thread-lean/observations/two-trembles/check_records.py
      - name: Check both continuations of every reversed-replay study checkpoint
        run: python3 -B lean/sims-meeting-thread-lean/observations/reversed-replay/check_records.py
      - name: Check the published receipt against the proof inputs
        if: github.event_name == 'push' || hashFiles('lean/sims-meeting-thread-lean/evidence-linux/source.json') != ''
        run: python3 lean/sims-meeting-thread-lean/check_saved_receipt.py

name: Fluid-study records

on:
  push:
    branches: [main]
    paths:
      - 'research/hug-v3/fluid-grid-study/**'
      - '.github/workflows/fluid-study-records.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/hug-v3/fluid-grid-study/**'
      - '.github/workflows/fluid-study-records.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recount:
    name: Recount saved results (no fluid or Lean run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recount pair records and confirm both pass and fail findings
        working-directory: research/hug-v3/fluid-grid-study
        run: |
          python3 -B verify.py --output "$RUNNER_TEMP/fluid-recount.json"
          python3 -B -m unittest test_verify.py
          python3 - "$RUNNER_TEMP/fluid-recount.json" <<'PY'
          import json, pathlib, sys
          saved=json.loads(pathlib.Path('recount.json').read_text())
          fresh=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert fresh == saved, 'Fresh recount differs from published receipt'
          PY
      - name: Attach this recount to the GitHub run
        env:
          OUTPUT: ${{ runner.temp }}/fluid-recount.json
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['OUTPUT'])
          result=json.loads(p.read_text())
          result['github_run']={'sha':os.environ['SOURCE_SHA'],'url':f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}"}
          p.write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fluid-study-recount-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fluid-recount.json
          if-no-files-found: error

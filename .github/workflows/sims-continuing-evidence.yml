name: Continuing Traveller B evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "research/sims-continuing-evidence/**"
      - "lean/sims-mentor-first-thought-lean/**"
      - "lean/sims-meeting-thread-lean/observations/pager-return/**"
      - ".github/workflows/sims-continuing-evidence.yml"
      - "scripts/ci-lean-toolchain.sh"
  push:
    branches: [main]
    paths:
      - "research/sims-continuing-evidence/**"
      - "lean/sims-mentor-first-thought-lean/**"
      - "lean/sims-meeting-thread-lean/observations/pager-return/**"
      - ".github/workflows/sims-continuing-evidence.yml"
      - "scripts/ci-lean-toolchain.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  records:
    name: Four continuing listeners and original inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -B research/sims-continuing-evidence/check_records.py
      - run: python3 scripts/check_public_paths.py
  proof:
    name: Native Lean records and observation rules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch the pinned Lean release
        run: bash scripts/ci-lean-toolchain.sh fetch "$RUNNER_TEMP/continuing-tools"
      - name: Install the checked Lean archive
        working-directory: research/sims-continuing-evidence
        run: bash "$GITHUB_WORKSPACE/scripts/ci-lean-toolchain.sh" install "$RUNNER_TEMP/continuing-tools" "$RUNNER_TEMP/continuing-lean"
      - name: Check every recorded statement and axiom dependency
        working-directory: research/sims-continuing-evidence
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -B verify.py --work-dir "$RUNNER_TEMP/continuing-check"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: continuing-traveller-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/continuing-check/receipt.json
            ${{ runner.temp }}/continuing-check/*.log
          if-no-files-found: warn

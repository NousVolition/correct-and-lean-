   <g id="text_2">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #42586a" x="40.32" y="81.241062" transform="rotate(-0 40.32 81.241062)">Three completed studies  |  threshold 0.015  |  after-write tick 41: model time 1.2 to 1.3</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2867a4" x="50.688" y="141.614766" transform="rotate(-0 50.688 141.614766)">SAME IDENTITY</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13.1px; font-family: 'DejaVu Sans'; fill: #182e40" transform="translate(50.688 172.952281)">540 leaves the pair's view.</text>
    <text style="font-size: 13.1px; font-family: 'DejaVu Sans'; fill: #182e40" transform="translate(50.688 193.216344)">872 enters it.</text>
    <text style="font-size: 13.1px; font-family: 'DejaVu Sans'; fill: #182e40" transform="translate(50.688 210.942281)">Both labels stay identifiable.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2867a4" x="323.712" y="141.614766" transform="rotate(-0 323.712 141.614766)">SAME RECORD</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13.1px; font-family: 'DejaVu Sans'; fill: #182e40" transform="translate(323.712 174.221344)">3 shared decoded records</text>
    <text style="font-size: 13.1px; font-family: 'DejaVu Sans'; fill: #182e40" transform="translate(323.712 191.947281)">stay byte-for-byte unchanged.</text>
    <text style="font-size: 13.1px; font-family: 'DejaVu Sans'; fill: #182e40" transform="translate(323.712 212.211344)">Stored material still evolves.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2867a4" x="596.736" y="141.614766" transform="rotate(-0 596.736 141.614766)">SAME ORIGIN?</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13.1px; font-family: 'DejaVu Sans'; fill: #182e40" transform="translate(596.736 172.952281)">44.65% of starting context</text>
    <text style="font-size: 13.1px; font-family: 'DejaVu Sans'; fill: #182e40" transform="translate(596.736 192.548039)">is still inside; 55.35%</text>
    <text style="font-size: 13.1px; font-family: 'DejaVu Sans'; fill: #182e40" transform="translate(596.736 212.211344)">is elsewhere in the domain.</text>
   </g>

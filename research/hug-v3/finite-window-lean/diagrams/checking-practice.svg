<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="385" viewBox="0 0 1200 385" role="img" aria-labelledby="title description"><title id="title">How the result stays attached to the evidence</title><desc id="description">Saved records lead to exact decimal values, Lean checks and a receipt containing input hashes and results. GitHub reruns the checks and refuses stale or incomplete evidence. The scope is the window rule and recorded numbers, not the fluid simulation.</desc><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172d36}
.title{font-size:30px;font-weight:700}.heading{font-size:23px;font-weight:700}
.body{font-size:18px}.small{font-size:15px;fill:#536970}.tiny{font-size:12px;fill:#536970}
.number{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums}
</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#64777e" stroke-width="1.5"/></marker></defs><rect width="1200" height="385" rx="18" fill="#f8faf9"/><text x="35" y="48" class="title">How the result stays attached to the evidence</text><rect x="25" y="81" width="250" height="135" rx="12" fill="#fff" stroke="#c9d9d6"/><text x="42" y="115" class="heading">1  Keep the records</text><text x="42" y="153" class="body">Saved CSV files</text><text x="42" y="184" class="small">25 pairs × 51 times</text><path d="M285 149 H312" fill="none" stroke="#64777e" stroke-width="2" marker-end="url(#arrow)"/><rect x="325" y="81" width="250" height="135" rx="12" fill="#fff" stroke="#c9d9d6"/><text x="342" y="115" class="heading">2  Keep the numbers</text><text x="342" y="153" class="body">Exact decimal values</text><text x="342" y="184" class="small">No rounding introduced</text><path d="M585 149 H612" fill="none" stroke="#64777e" stroke-width="2" marker-end="url(#arrow)"/><rect x="625" y="81" width="250" height="135" rx="12" fill="#fff" stroke="#c9d9d6"/><text x="642" y="115" class="heading">3  Run Lean</text><text x="642" y="153" class="body">Window rule + table checks</text><text x="642" y="184" class="small">Assumptions stay explicit</text><path d="M885 149 H912" fill="none" stroke="#64777e" stroke-width="2" marker-end="url(#arrow)"/><rect x="925" y="81" width="250" height="135" rx="12" fill="#fff" stroke="#c9d9d6"/><text x="942" y="115" class="heading">4  Keep the receipt</text><text x="942" y="153" class="body">Input hashes + results</text><text x="942" y="184" class="small">Matches the checked inputs</text><rect x="25" y="236" width="1150" height="70" rx="12" fill="#e8f1ef"/>
<text x="46" y="265" class="body">GitHub reruns the checks and compares the receipt with the published inputs.</text>
<text x="46" y="290" class="small">Changed measurement, missing target or failed compiler step → the receipt check refuses it.</text>
<text x="27" y="339" class="body">Checked: window reasoning and recorded numbers. Fluid simulation: outside this verification.</text>
<text x="27" y="367" class="tiny">AI-generated; dictated and directed by NousVolition.</text></svg>
